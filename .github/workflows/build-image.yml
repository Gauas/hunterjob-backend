name: Build and publish images

on:
  push:
    branches: [develop, refactor/identity-service-local-jwt]
  pull_request:
    branches: [develop]
    paths:
      - "**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: echo "VERSION=0.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test and vet
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.27-alpine sh -c 'go test ./... && go vet ./...'

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hunterjob-api:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hunterjob-api:${{ steps.version.outputs.VERSION }}

      - name: Build and push matcher worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.matcher
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hunterjob-matcher:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hunterjob-matcher:${{ steps.version.outputs.VERSION }}
