name: Build and publish images

on:
  pull_request:
    branches: [develop]
    paths:
      - "**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: echo "VERSION=0.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hunterjob-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hunterjob-api:${{ steps.version.outputs.VERSION }}

      - name: Build and push crawler worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hunterjob-crawler:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hunterjob-crawler:${{ steps.version.outputs.VERSION }}
