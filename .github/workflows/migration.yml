name: Database Migration

on:
  push:
    branches: [develop]
    paths:
      - "migrations/**"
      - ".github/workflows/migration.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    name: Run MongoDB migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run migrations
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "MONGODB_URI is required"
            exit 1
          fi
          docker run --rm --network host \
            --entrypoint /bin/bash \
            -e MONGODB_URI \
            -v "$PWD/migrations:/migrations:ro" \
            mongo:8 /migrations/run-migrations.sh
